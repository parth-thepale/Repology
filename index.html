<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REPOLOGY // REPOSITORY_ORIENTATION_CONTROL_PLANE</title>
    <meta
      name="description"
      content="High-density industrial orientation control plane for public GitHub repositories. Telemetry, verified manifests, sanitized markdown terminal, and contribution entry points."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23000%22/><text y=%22.75em%22 x=%2250%25%22 text-anchor=%22middle%22 font-family=%22monospace%22 font-size=%2265%22 font-weight=%22bold%22 fill=%22%2310B981%22>R</text></svg>" />
    
    <!-- Precision Typography: Geist & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body class="canvas-root">
    <!-- Outer structural boundary rails -->
    <div class="structural-rail rail-left" aria-hidden="true"></div>
    <div class="structural-rail rail-right" aria-hidden="true"></div>

    <div class="app-layout-frame">
      <!-- Sticky Mission-Control Header Bar -->
      <header class="app-header" role="banner">
        <div class="header-inner">
          <div class="header-left">
            <a href="/" class="brand-link" id="brand-home-link" aria-label="Repology Control Plane Home">
              <span class="brand-glyph" aria-hidden="true">■</span>
              <span class="brand-title">REPOLOGY</span>
              <span class="brand-separator">//</span>
              <span class="brand-sub">RADAR_ORIENTATION</span>
            </a>
            <span class="badge badge-mono">[v0.1.0_PROD]</span>
            <div class="system-led-group" title="System Status: Ready">
              <span class="led-indicator led-active"></span>
              <span class="led-label">ONLINE</span>
            </div>
          </div>

          <div class="header-right">
            <div class="header-telemetry" id="header-rate-telemetry">
              <span class="telemetry-label">API_QUOTA:</span>
              <span class="telemetry-val" id="telemetry-rate-remaining">READY</span>
              <span class="telemetry-divider">|</span>
              <span class="telemetry-label">RATE:</span>
              <span class="telemetry-val" id="telemetry-rate-reset">60/HR</span>
            </div>
            <a
              href="https://github.com"
              class="header-action-btn"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub API link"
            >
              GH_API ↗
            </a>
          </div>
        </div>
      </header>

      <!-- Main Operational Control Surface -->
      <main id="app" class="main-content" role="main" aria-live="polite">
        <!-- Injected dynamically by main.js -->
      </main>

      <!-- Technical Blueprint Footer -->
      <footer class="app-footer" role="contentinfo">
        <div class="footer-inner">
          <div class="footer-left">
            <span class="footer-mono-label">SYS // REPOLOGY_CONTROL_PLANE</span>
            <span class="footer-text">
              Zero code execution. Read-only GitHub REST telemetry. Client-side DOMPurify sanitizer.
            </span>
          </div>
          <div class="footer-right">
            <span class="footer-tag">[NO_AUTH_REQUIRED]</span>
            <span class="footer-tag">[AIRGAPPED_DOM]</span>
            <span class="footer-tag">[UNIX_EPOCH_SYNC]</span>
          </div>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
