<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Repology — Understand the code. Find your way in.</title>
    <meta
      name="description"
      content="A lightweight open-source orientation tool for public GitHub repositories. Fast file map, setup signals, sanitized README preview, and contribution links."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧭</text></svg>" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link rel="stylesheet" href="/src/styles/components.css" />
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header" role="banner">
      <div class="header-inner">
        <a href="/" class="brand-link" id="brand-home-link" aria-label="Repology homepage">
          <div class="brand-logo-icon" aria-hidden="true">R</div>
          <span class="brand-title">Repology</span>
          <span class="brand-tagline-badge">Orientation Guide</span>
        </a>
        <nav class="header-nav" aria-label="Main Navigation">
          <a
            href="https://github.com/repology"
            class="header-nav-link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub Repository"
          >
            GitHub
          </a>
        </nav>
      </div>
    </header>

    <!-- Main Container -->
    <main id="app" class="main-content" role="main" aria-live="polite">
      <!-- Injected dynamically by main.js -->
    </main>

    <!-- App Footer -->
    <footer class="app-footer" role="contentinfo">
      <div class="footer-inner">
        <div class="footer-info">
          <p><strong>Repology</strong> — Understand the code. Find your way in.</p>
          <p class="footer-disclaimer">
            Read-only orientation tool for public GitHub repositories. Not affiliated with GitHub. No code execution, accounts, or telemetry.
          </p>
        </div>
        <div class="footer-links">
          <a href="https://docs.github.com/en/rest" target="_blank" rel="noopener noreferrer">GitHub API</a>
          <a href="https://github.com" target="_blank" rel="noopener noreferrer">github.com</a>
        </div>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
